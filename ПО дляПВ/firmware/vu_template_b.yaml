# Объект на универсальной платформе: шаблон Б (EC + электронагрев ступенями).
# Плата Waveshare ESP32-S3-ETH-8DI-8RO, модули Modbus на шине №1, диспетчеризация на втором RS-485.
#
# Порядок: плата → ядро → диспетчеризация → профиль; substitutions этого файла — главнее всех.
# Перед сборкой ЗАПОЛНИТЬ регистры модулей по их паспортам (раздел «Регистры модулей» ниже):
# без них сборка остановится с ошибкой «substitution not defined» — это сделано намеренно.

substitutions:
  device_name: vu-object
  friendly_name: "Приточно-вытяжная (шаблон Б)"
  setpoint_default: "18"
  timezone: "MSK-3"

  # --- Регистры модулей — ПО ПАСПОРТАМ (раскомментировать и заполнить) ---
  # do_reg: ""             # регистр выхода 1 модуля дискретных выходов
  # do_on_value: ""        # значение «включено» (напр. 1 или 1000)
  # di_reg: ""             # регистр входа 1 / битовой маски входов
  # di_reg_step: ""        # "0" — битовая маска, "1" — регистр на вход
  # di_bit_step: ""        # "1" — битовая маска, "0" — регистр на вход
  # di_register_type: ""   # holding | read
  # ai_reg: ""             # регистр измерения входа 1
  # ai_reg_step: ""        # шаг регистров между входами (FP32 — обычно 2 и более)
  # ai_value_type: ""      # FP32 | S_WORD | ...
  # ai_register_type: ""   # holding | read
  # ai_multiply: ""        # множитель к значению регистра (напр. 1 или 0.1)

  # --- Установка: 1200 м³/ч, рекуператор 75 %, ввод 230 В 32 А (docs/bom_template_b.md, B2) ---
  heater_power_kw: "6"                       # 2 ступени по 2 кВт + плавная 2 кВт
  heat_steps: "id(m_do_7), id(m_do_8)"
  heat_analog_units: "1.0"

  # --- Диспетчеризация ---
  bms_address: "1"
  bms_baud: "19200"
  bms_write_enabled: "false"   # "true" — разрешить запись режима, уставки, сброса аварий

packages:
  board: !include boards/waveshare_s3_eth_8di_8ro.yaml
  network: !include packages/core/network_eth.yaml
  time: !include packages/core/time.yaml
  ui: !include packages/core/ui.yaml
  protection: !include packages/core/protection.yaml
  diagnostics: !include packages/core/diagnostics.yaml
  control: !include packages/core/control.yaml
  bms: !include packages/comm/bms_modbus_server.yaml
  profile: !include profiles/template_b_ec_steps.yaml
