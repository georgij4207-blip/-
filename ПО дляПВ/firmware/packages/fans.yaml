# Вентиляторы: режим Стоп/1/2/3 и смещение вытяжки (уставки пользователя) + состояние.
# Последовательность пуска/останова — vent::FanController внутри vent::VentSystem,
# цикл управления — control.yaml.

select:
  - platform: template
    id: vent_mode
    name: "mode Режим вентиляции"
    options:
      - "Стоп"
      - "Скорость 1"
      - "Скорость 2"
      - "Скорость 3"
    initial_option: "Стоп"
    optimistic: true
    restore_value: true   # после пропадания питания — возврат к режиму (через полный пуск)

number:
  - platform: template
    id: exhaust_offset
    name: "exhaust_offset Смещение вытяжки"
    min_value: -1
    max_value: 1
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

text_sensor:
  - platform: template
    id: fan_state_text
    name: "fan_state Состояние вентиляции"
    update_interval: never

sensor:
  - platform: template
    name: "supply_speed Приток: ступень"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return vent::vent_system().fans().supply_speed();'
    filters:
      - delta: 0.5
  - platform: template
    name: "exhaust_speed Вытяжка: ступень"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return vent::vent_system().fans().exhaust_speed();'
    filters:
      - delta: 0.5
  - platform: template
    name: "frost_level Обмерзание: снижение притока"
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: 'return vent::vent_system().frost_level();'
    filters:
      - delta: 0.5

binary_sensor:
  - platform: template
    name: "fan_heat_ok Нагрев разрешён вентиляцией"
    entity_category: diagnostic
    lambda: 'return vent::vent_system().fans().heat_permitted(millis());'
