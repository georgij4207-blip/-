# Вентиляторы: режим Стоп/1/2/3 + смещение вытяжки, последовательность пуска/останова,
# заслонка. Логика — vent::FanController (include/vent_fans.h), здесь только связка
# с реле и интерфейсом. Параметры — в substitutions главного файла.

esphome:
  includes:
    - include/vent_fans.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          vent::FanConfig cfg;
          cfg.damper_enabled = ${damper_enabled};
          cfg.damper_open_ms = ${damper_open_ms};
          cfg.exhaust_lead_ms = ${exhaust_lead_ms};
          cfg.purge_ms = ${purge_ms};
          cfg.heat_delay_ms = ${heat_enable_delay_ms};
          cfg.rundown_ms = ${fan_rundown_ms};
          cfg.switch_pause_ms = ${fan_switch_pause_ms};
          vent::fan_controller().configure(cfg);

select:
  - platform: template
    id: vent_mode
    name: "mode Режим вентиляции"
    options:
      - "Стоп"
      - "Скорость 1"
      - "Скорость 2"
      - "Скорость 3"
    initial_option: "Стоп"
    optimistic: true
    restore_value: true   # после пропадания питания — возврат к режиму (через полный пуск)

number:
  - platform: template
    id: exhaust_offset
    name: "exhaust_offset Смещение вытяжки"
    min_value: -1
    max_value: 1
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

interval:
  - interval: ${fan_tick}
    then:
      - lambda: |-
          if (!${fan_logic_enabled})
            return;
          const uint32_t now = millis();

          // Запрос скоростей. Раздельная уставка притока/вытяжки = другой расчёт req.
          uint8_t mode = id(vent_mode).active_index().value_or(0);
          if (now < ${boot_start_delay_ms})
            mode = 0;  // после загрузки даём подняться периферии
          vent::FanRequest req = vent::speeds_from_mode(mode, (int) id(exhaust_offset).state);
          req.emergency_stop = false;  // шаг 5: защиты

          auto &c = vent::fan_controller();
          c.update(now, req);

          auto apply = [](esphome::switch_::Switch *sw, bool on) {
            if (sw->state != on) {
              if (on) sw->turn_on(); else sw->turn_off();
            }
          };
          // Сначала выключения, потом включения — на выходах никогда нет двух ступеней.
          const uint8_t sm = c.supply_relay_mask(), em = c.exhaust_relay_mask();
          esphome::switch_::Switch *sup[3] = {id(relay_k1), id(relay_k2), id(relay_k3)};
          esphome::switch_::Switch *exh[3] = {id(relay_k4), id(relay_k5), id(relay_k6)};
          for (int i = 0; i < 3; i++) {
            if (!(sm & (1 << i))) apply(sup[i], false);
            if (!(em & (1 << i))) apply(exh[i], false);
          }
          for (int i = 0; i < 3; i++) {
            if (sm & (1 << i)) apply(sup[i], true);
            if (em & (1 << i)) apply(exh[i], true);
          }
          if (${damper_enabled})
            apply(id(relay_k7), c.damper_open_cmd());

          const char *txt = c.state_text();
          if (id(fan_state_text).state != txt)
            id(fan_state_text).publish_state(txt);

text_sensor:
  - platform: template
    id: fan_state_text
    name: "fan_state Состояние вентиляции"
    update_interval: never

sensor:
  - platform: template
    name: "supply_speed Приток: ступень"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return vent::fan_controller().supply_speed();'
    filters:
      - delta: 0.5
  - platform: template
    name: "exhaust_speed Вытяжка: ступень"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return vent::fan_controller().exhaust_speed();'
    filters:
      - delta: 0.5

binary_sensor:
  - platform: template
    id: fan_heat_permitted
    name: "fan_heat_ok Нагрев разрешён вентиляцией"
    entity_category: diagnostic
    lambda: 'return vent::fan_controller().heat_permitted(millis());'
