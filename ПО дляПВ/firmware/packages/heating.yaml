# Нагрев: SSR основного ТЭНа (slow_pwm от ПИ-регулятора) и SSR преднагревателя (вкл/выкл).
# Ключи SSR — активный LOW (docs/ssr_driver.md): inverted, «выкл» = HIGH = как при загрузке.
# Решения принимает vent::VentSystem (control.yaml), здесь выходы и уставки.

output:
  - platform: slow_pwm
    id: out_ssr_heater
    pin:
      number: ${ssr_heater_pin}
      inverted: true
    period: ${heater_pwm_period}
    restart_cycle_on_state_change: true
  - platform: gpio
    id: out_ssr_preheater
    pin:
      number: ${ssr_preheater_pin}
      inverted: true

number:
  - platform: template
    id: supply_setpoint
    name: "setpoint Уставка притока"
    unit_of_measurement: "°C"
    min_value: ${setpoint_min}
    max_value: ${setpoint_max}
    step: 0.5
    initial_value: ${setpoint_default}
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: pi_kp
    name: "pi_kp ПИ: Kp, % на °C"
    min_value: 0
    max_value: 100
    step: 0.5
    initial_value: ${pi_kp}
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: pi_ti
    name: "pi_ti ПИ: Ti, с (0 = без И)"
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: ${pi_ti_s}
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

switch:
  - platform: template
    id: heating_enable
    name: "heating_enable Нагрев притока (зима)"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: template
    name: "heater_pct Мощность ТЭНа"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return vent::vent_system().outputs().heater_pct;'
  - platform: template
    name: "heater_kw Мощность ТЭНа, кВт"
    unit_of_measurement: "kW"
    device_class: power
    accuracy_decimals: 2
    update_interval: 5s
    lambda: 'return vent::vent_system().outputs().heater_pct / 100.0f * ${heater_power_kw};'

binary_sensor:
  - platform: template
    name: "preheater Преднагреватель"
    lambda: 'return vent::vent_system().outputs().preheater;'
