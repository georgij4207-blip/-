# Драйвер канала: NTC на АЦП ESP32 (ADC1) с подтяжкой на плате (порт TEM/HUMI).
# Не зависит от I2C/ADS1115. Опорное — параметр (шина 3,3 В платы).
#
# vars:
#   sensor_id    — id итоговой температуры (например t_supply)
#   sensor_name  — имя для интерфейса
#   adc_pin      — вывод ADC1 (GPIO36/GPIO39; ADC2 не использовать — занят Wi-Fi)
#   offset       — поправка калибровки, °C
#
# Создаёт те же сущности, что и ntc_ads1115.yaml.

sensor:
  - platform: adc
    id: ${sensor_id}_v
    name: "${sensor_id} ${sensor_name}: напряжение"
    pin: ${adc_pin}
    attenuation: 12db
    samples: ${adc_samples}
    update_interval: ${ntc_update_interval}
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - timeout: ${sensor_stale_timeout}
    on_value:
      - component.update: ${sensor_id}_r

  - platform: template
    id: ${sensor_id}_r
    name: "${sensor_id} ${sensor_name}: сопротивление"
    unit_of_measurement: "Ω"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const float v = id(${sensor_id}_v).state;
      if (vent::classify_divider(v, ${adc_pullup_voltage}, ${adc_open_ratio}, ${adc_short_ratio},
                                 ${vref_min}, ${vref_max}) != vent::SENSOR_OK)
        return NAN;
      return vent::divider_low_side_resistance(v, ${adc_pullup_voltage}, ${adc_pullup_r});

  - platform: ntc
    id: ${sensor_id}
    name: "${sensor_id} ${sensor_name}"
    sensor: ${sensor_id}_r
    accuracy_decimals: 1
    calibration:
      b_constant: ${ntc_b_constant}
      reference_temperature: 25°C
      reference_resistance: ${ntc_r25}
    filters:
      - offset: ${offset}
      - lambda: |-
          if (x < ${t_valid_min} || x > ${t_valid_max}) return NAN;
          return x;

  - platform: template
    id: ${sensor_id}_status
    internal: true
    update_interval: ${ntc_update_interval}
    lambda: |-
      auto s = vent::classify_divider(id(${sensor_id}_v).state, ${adc_pullup_voltage},
                                      ${adc_open_ratio}, ${adc_short_ratio},
                                      ${vref_min}, ${vref_max});
      return (float) vent::final_status(s, id(${sensor_id}).state);
    filters:
      - delta: 0.5
    on_value:
      - text_sensor.template.publish:
          id: ${sensor_id}_status_text
          state: !lambda 'return vent::sensor_status_text((vent::SensorStatus) (int) x);'

binary_sensor:
  - platform: template
    id: ${sensor_id}_fault
    name: "${sensor_id} ${sensor_name}: неисправность"
    device_class: problem
    lambda: 'return !(id(${sensor_id}_status).state == 0.0f);'

text_sensor:
  - platform: template
    id: ${sensor_id}_status_text
    name: "${sensor_id} ${sensor_name}: состояние"
    update_interval: never
