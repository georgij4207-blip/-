# Датчики температуры: ADS1115 (t_extract, t_exhaust, t_outdoor + опорное 3,3 В)
# и АЦП ESP32 (t_supply). Назначение каналов — в substitutions главного файла.

esphome:
  includes:
    - include/vent_sensors.h

ads1115:
  - id: ads_hub
    address: ${ads1115_address}
    i2c_id: bus_main

sensor:
  - platform: ads1115
    ads1115_id: ads_hub
    id: ntc_vref
    name: "vref Опорное 3,3 В делителей"
    multiplexer: ${ads_vref_channel}
    gain: 4.096
    update_interval: ${ntc_update_interval}
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - timeout: ${sensor_stale_timeout}

packages:
  t_extract: !include
    file: drivers/ntc_ads1115.yaml
    vars:
      sensor_id: t_extract
      sensor_name: "Вытяжка из помещения"
      ads_channel: ${t_extract_channel}
      offset: ${t_extract_offset}
  t_exhaust: !include
    file: drivers/ntc_ads1115.yaml
    vars:
      sensor_id: t_exhaust
      sensor_name: "Выброс"
      ads_channel: ${t_exhaust_channel}
      offset: ${t_exhaust_offset}
  t_outdoor: !include
    file: drivers/ntc_ads1115.yaml
    vars:
      sensor_id: t_outdoor
      sensor_name: "Наружный воздух"
      ads_channel: ${t_outdoor_channel}
      offset: ${t_outdoor_offset}
  t_supply: !include
    file: drivers/ntc_esp32_adc.yaml
    vars:
      sensor_id: t_supply
      sensor_name: "Приток"
      adc_pin: ${t_supply_pin}
      offset: ${t_supply_offset}
