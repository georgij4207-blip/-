# Железо платы KinCony KC868-A8: ESP32, I2C, PCF8574 (реле и входы), выходы SSR.
# Все пины и адреса — из substitutions главного файла.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

i2c:
  id: bus_main
  sda: ${i2c_sda}
  scl:
    number: ${i2c_scl}
    ignore_strapping_warning: true   # GPIO5 — strapping-пин, но SCL на этой плате разведён на нём
  frequency: ${i2c_frequency}
  scan: true

pcf8574:
  - id: pcf_relays
    address: ${pcf_relays_address}
  - id: pcf_inputs
    address: ${pcf_inputs_address}

# Выходы на SSR (GPIO14/13) объявлены в heating.yaml: slow_pwm для ТЭНа, gpio для преднагревателя.

# Реле. На KC868-A8 реле включаются нулём на PCF8574, поэтому inverted.
# После включения питания PCF8574 держит выходы в «1» = все реле выключены.
# Реле управляет логика (fans.yaml), поэтому в интерфейсе они скрыты (relays_internal).
# Для ручной проверки на стенде: relays_internal: "false" и fan_logic_enabled: "false".
switch:
  - platform: gpio
    id: relay_k1
    name: "K1 Приток ступень 1"
    pin: { pcf8574: pcf_relays, number: "${k1_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
    interlock: [relay_k1, relay_k2, relay_k3]
    interlock_wait_time: ${fan_interlock_wait}
  - platform: gpio
    id: relay_k2
    name: "K2 Приток ступень 2"
    pin: { pcf8574: pcf_relays, number: "${k2_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
    interlock: [relay_k1, relay_k2, relay_k3]
    interlock_wait_time: ${fan_interlock_wait}
  - platform: gpio
    id: relay_k3
    name: "K3 Приток ступень 3"
    pin: { pcf8574: pcf_relays, number: "${k3_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
    interlock: [relay_k1, relay_k2, relay_k3]
    interlock_wait_time: ${fan_interlock_wait}
  - platform: gpio
    id: relay_k4
    name: "K4 Вытяжка ступень 1"
    pin: { pcf8574: pcf_relays, number: "${k4_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
    interlock: [relay_k4, relay_k5, relay_k6]
    interlock_wait_time: ${fan_interlock_wait}
  - platform: gpio
    id: relay_k5
    name: "K5 Вытяжка ступень 2"
    pin: { pcf8574: pcf_relays, number: "${k5_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
    interlock: [relay_k4, relay_k5, relay_k6]
    interlock_wait_time: ${fan_interlock_wait}
  - platform: gpio
    id: relay_k6
    name: "K6 Вытяжка ступень 3"
    pin: { pcf8574: pcf_relays, number: "${k6_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
    interlock: [relay_k4, relay_k5, relay_k6]
    interlock_wait_time: ${fan_interlock_wait}
  - platform: gpio
    id: relay_k7
    name: "K7 Заслонка"
    pin: { pcf8574: pcf_relays, number: "${k7_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}
  - platform: gpio
    id: relay_k8
    name: "K8 Норма (fail-safe)"
    pin: { pcf8574: pcf_relays, number: "${k8_channel}", mode: { output: true }, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: ${relays_internal}

# Входы. На KC868-A8 вход активен при замыкании на GND → inverted.
# Здесь «ON» = контакт замкнут. Трактовка NC/NO — в пакете защит (шаг 5).
binary_sensor:
  - platform: gpio
    id: in_x1
    name: "X1 Аварийный термостат ТЭНа (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x1_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x2
    name: "X2 Фильтр приток (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x2_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x3
    name: "X3 Фильтр вытяжка (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x3_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x4
    name: "X4 Внешний стоп (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x4_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x5
    name: "X5 Термостат ТЭНа +50 (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x5_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x6
    name: "X6 Термостат преднагревателя (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x6_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x7
    name: "X7 Поток притока (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x7_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]
  - platform: gpio
    id: in_x8
    name: "X8 Пожарная сигнализация (замкнут)"
    pin: { pcf8574: pcf_inputs, number: "${x8_channel}", mode: { input: true }, inverted: true }
    filters: [ delayed_on_off: "${input_debounce}" ]

  # Состояние реле для интерфейса (только чтение)
  - platform: template
    name: "K1 Реле приток ст.1"
    entity_category: diagnostic
    lambda: 'return id(relay_k1).state;'
  - platform: template
    name: "K2 Реле приток ст.2"
    entity_category: diagnostic
    lambda: 'return id(relay_k2).state;'
  - platform: template
    name: "K3 Реле приток ст.3"
    entity_category: diagnostic
    lambda: 'return id(relay_k3).state;'
  - platform: template
    name: "K4 Реле вытяжка ст.1"
    entity_category: diagnostic
    lambda: 'return id(relay_k4).state;'
  - platform: template
    name: "K5 Реле вытяжка ст.2"
    entity_category: diagnostic
    lambda: 'return id(relay_k5).state;'
  - platform: template
    name: "K6 Реле вытяжка ст.3"
    entity_category: diagnostic
    lambda: 'return id(relay_k6).state;'
  - platform: template
    name: "K7 Реле заслонка"
    entity_category: diagnostic
    lambda: 'return id(relay_k7).state;'
  - platform: template
    name: "K8 Реле норма"
    entity_category: diagnostic
    lambda: 'return id(relay_k8).state;'

sensor:
  - platform: uptime
    name: "uptime Время работы"
    entity_category: diagnostic

button:
  - platform: restart
    name: "restart Перезагрузка контроллера"
    entity_category: diagnostic
