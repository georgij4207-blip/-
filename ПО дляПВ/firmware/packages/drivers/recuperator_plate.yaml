# Драйвер рекуператора: пластинчатый (перекрёстный/противоточный) с электрическим
# преднагревателем и лестницей защиты от обмерзания (include/vent/recuperator_plate.h).
#
# vars (остальное — substitutions профиля):
#   preheater_pin             — вывод на ключ SSR преднагревателя (активный LOW)
#   preheat_th_enabled        — "true"/"false"; preheat_th_input, preheat_th_contact

output:
  - platform: gpio
    id: out_ssr_preheater
    pin:
      number: ${preheater_pin}
      inverted: true

packages:
  core: !include
    file: recuperator_plate_core.yaml
    vars:
      preheater_expr: "vent::esph::bout(id(out_ssr_preheater))"
      preheat_th_input: ${preheat_th_input}
      preheat_th_contact: "${preheat_th_contact}"
