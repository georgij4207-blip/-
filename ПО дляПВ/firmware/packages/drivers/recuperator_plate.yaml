# Драйвер рекуператора: пластинчатый (перекрёстный/противоточный) с электрическим
# преднагревателем и лестницей защиты от обмерзания (include/vent/recuperator_plate.h).
#
# vars (остальное — substitutions профиля):
#   preheater_pin             — вывод на ключ SSR преднагревателя (активный LOW)
#   preheat_th_enabled        — "true"/"false"; preheat_th_input, preheat_th_contact

output:
  - platform: gpio
    id: out_ssr_preheater
    pin:
      number: ${preheater_pin}
      inverted: true

esphome:
  on_boot:
    - priority: -50
      then:
        - lambda: |-
            vent::PlateRecuperatorConfig c;
            c.preheat_on_below = ${preheat_on_below};
            c.preheat_off_above = ${preheat_off_above};
            c.frost_c = ${frost_c};
            c.recover_c = ${frost_recover_c};
            c.step_ms = ${frost_step_ms};
            c.recover_ms = ${frost_recover_ms};
            c.exhaust_only_max_ms = ${exhaust_only_max_ms};
            c.forbid_imbalance = ${exhaust_only_forbidden};
            c.max_level = ${fan_levels};
            vent::vent_system().set_recuperator(new vent::PlateRecuperator(
                vent::esph::bout(id(out_ssr_preheater)),
                ${preheat_th_enabled} ? vent::esph::in(id(${preheat_th_input}), "${preheat_th_contact}") : nullptr,
                c));
