# Модуль дискретных выходов: 16 каналов, по одному регистру хранения на выход (функции 3 / 6).
# Включено = в регистр пишется on_value, выключено = 0; состояние читается обратно — если модуль
# сбросил выход (перезагрузка, безопасное состояние), логика увидит и перепишет.
# Модули с выходами одним регистром-битовой маской этим пакетом НЕ поддерживаются.
#
# vars:
#   m          — префикс id модуля (тот же, что в modbus_module.yaml); каналы: ${m}_1…${m}_16
#   reg        — адрес регистра выхода 1 (выход k — reg + k − 1) — ПО ПАСПОРТУ МОДУЛЯ
#   on_value   — значение «включено» в регистре (напр. 1 или 1000) — ПО ПАСПОРТУ МОДУЛЯ
# substitutions профиля: io_internal ("true" — скрыть каналы из интерфейса)

switch:
  - platform: modbus_controller
    modbus_controller_id: ${m}
    id: ${m}_1
    name: "${m}_1"
    internal: ${io_internal}
    register_type: holding
    address: ${ reg|int + 0 }
    bitmask: ${on_value}
  - platform: modbus_controller
    modbus_controller_id: ${m}
    id: ${m}_2
    name: "${m}_2"
    internal: ${io_internal}
    register_type: holding
    address: ${ reg|int + 1 }
    bitmask: ${on_value}
