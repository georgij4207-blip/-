# Модуль дискретных входов: 16 каналов. Адрес и бит канала k:
#   регистр = reg + (k − 1) × reg_step,  маска = 2 ^ ((k − 1) × bit_step)
#   все входы одним регистром-битовой маской: reg_step "0", bit_step "1";
#   по регистру на вход (значение 0/1):      reg_step "1", bit_step "0".
# ON = на входе сигнал («замкнут»); NC/NO — в обёртке vent::esph::in(), как у входов платы.
# При потере связи состояние входов замирает — поэтому модуль обязан быть в io_check_extra
# (авария «нет связи» → стоп).
#
# vars:
#   m          — префикс id модуля; каналы: ${m}_1…${m}_16
#   reg        — адрес регистра входа 1 / битовой маски — ПО ПАСПОРТУ МОДУЛЯ
#   reg_step, bit_step — см. выше
#   register_type — holding | read — ПО ПАСПОРТУ МОДУЛЯ
# substitutions профиля: io_internal, input_debounce

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${m}
    id: ${m}_1
    name: "${m}_1 (замкнут)"
    internal: ${io_internal}
    register_type: ${register_type}
    address: ${ reg|int + 0 * reg_step|int }
    bitmask: ${ 2 ** (0 * bit_step|int) }
    filters: [ delayed_on_off: "${input_debounce}" ]
