# Salda RIS 400P — плата управления на KinCony KC868-A8 (ESP32)
#
# Этот файл — только параметры оборудования и уставки (substitutions).
# Логика лежит в packages/*.yaml и параметры не хардкодит.
#
# Шаг 4: + вентиляторы (режим, последовательности пуска/останова, заслонка). Нагрева нет.

substitutions:
  device_name: ris400p
  friendly_name: "Salda RIS 400P"

  # --- I2C (разъём P19) ---
  i2c_sda: GPIO4
  i2c_scl: GPIO5
  i2c_frequency: 100kHz
  pcf_relays_address: "0x24"   # PCF8574 №1 — реле K1..K8 (подтвердить i2c-сканом)
  pcf_inputs_address: "0x22"   # PCF8574 №2 — входы X1..X8 (подтвердить i2c-сканом)

  # --- SSR через оптронный ключ, активный уровень LOW ---
  # HIGH, вход или подтяжка 4,7 кОм порта при загрузке = SSR выключен.
  ssr_heater_pin: GPIO14       # порт TEM/HUMI 1 — основной ТЭН 1,5 кВт
  ssr_preheater_pin: GPIO13    # порт TEM/HUMI 2 — преднагреватель 0,6 кВт

  # --- Реле: номер канала PCF8574 №1 (0..7) ---
  k1_channel: "0"   # приток, ступень 1
  k2_channel: "1"   # приток, ступень 2
  k3_channel: "2"   # приток, ступень 3
  k4_channel: "3"   # вытяжка, ступень 1
  k5_channel: "4"   # вытяжка, ступень 2
  k6_channel: "5"   # вытяжка, ступень 3
  k7_channel: "6"   # заслонка
  k8_channel: "7"   # сигнал «норма» (fail-safe: включено = всё в порядке)

  # Реле скрыты из интерфейса, ими управляет логика. Для ручной проверки на стенде
  # поставить relays_internal: "false" и fan_logic_enabled: "false".
  relays_internal: "true"

  # --- Входы: номер канала PCF8574 №2 (0..7) ---
  x1_channel: "0"   # аварийный термостат ТЭНа (+100 °C, допконтакт)
  x2_channel: "1"   # реле фильтра притока
  x3_channel: "2"   # реле фильтра вытяжки
  x4_channel: "3"   # внешний стоп
  x5_channel: "4"   # резерв (опц. термостат +50 °C)
  x6_channel: "5"   # резерв (опц. термостат преднагревателя)
  x7_channel: "6"   # реле перепада давления притока (через оптрон U3: замкнут = поток есть)
  x8_channel: "7"   # резерв
  input_debounce: 50ms

  # --- Датчики температуры (docs/ntc_inputs.md) ---
  ads1115_address: "0x48"
  ads_vref_channel: A3_GND     # опорное +3,3 В делителей через 1 кОм (ратиометрия)
  t_extract_channel: A0_GND    # вытяжка из помещения
  t_exhaust_channel: A1_GND    # выброс после рекуператора
  t_outdoor_channel: A2_GND    # наружный воздух
  t_supply_pin: GPIO36         # приток, порт TEM/HUMI 3 (ADC1)
  # GPIO39 (порт TEM/HUMI 4) — резерв

  # NTC (уточнить прозвонкой при 25 °C)
  ntc_b_constant: "3380"
  ntc_r25: 10kOhm

  ntc_update_interval: 1s
  sensor_stale_timeout: 5s     # нет новых данных дольше → «нет данных»

  # Делители ADS1115: 22 кОм от +3,3 В, NTC на GND
  ads_divider_r: "22000.0"
  ads_open_ratio: "0.970"      # U/Uref ≥ 0,970 → обрыв (≈ −57 °C)
  ads_short_ratio: "0.045"     # U/Uref ≤ 0,045 → КЗ (≈ +100 °C)
  vref_min: "3.13"             # допустимое опорное 3,3 В ±5 %
  vref_max: "3.47"

  # Порт TEM/HUMI: подтяжка 4,7 кОм к 3,3 В на плате
  adc_pullup_r: "4700.0"
  adc_pullup_voltage: "3.30"
  adc_open_ratio: "0.920"      # ≥ 3,04 В → обрыв (≈ −14 °C); проверить насыщение АЦП на стенде
  adc_short_ratio: "0.045"
  adc_samples: "16"

  # Допустимый диапазон температуры любого датчика
  t_valid_min: "-45.0"
  t_valid_max: "90.0"

  # Калибровочные поправки, °C
  t_extract_offset: "0.0"
  t_exhaust_offset: "0.0"
  t_outdoor_offset: "0.0"
  t_supply_offset: "0.0"

  # --- Вентиляторы: AC-моторы с отводами обмотки (3 ступени) ---
  fan_switch_pause_ms: "1500"  # пауза «всё выключено» при смене ступени
  fan_interlock_wait: ${fan_switch_pause_ms}ms  # резервная блокировка в драйвере реле ESPHome
  fan_tick: 200ms              # период логики вентиляции
  fan_logic_enabled: "true"
  boot_start_delay_ms: "10000" # после загрузки не стартовать раньше
  exhaust_lead_ms: "3000"      # пуск: вытяжка раньше притока; останов: вытяжка позже притока
  purge_ms: "120000"           # продувка притоком после отключения нагрева
  heat_enable_delay_ms: "10000"  # нагрев не раньше, чем через столько после пуска притока
  fan_rundown_ms: "15000"      # выбег после останова, затем закрытие заслонки

  # --- Заслонка (K7): привод 230 В с пружинным возвратом, K7 включено = открыть ---
  damper_enabled: "true"       # "false" — заслонки нет, K7 не используется
  damper_open_ms: "30000"      # время открытия привода

packages:
  board: !include packages/board_kc868_a8.yaml
  network: !include packages/network.yaml
  sensors: !include packages/sensors.yaml
  fans: !include packages/fans.yaml
