<text x="335" y="82.19999999999999" font-size="3.1"></text>
<text x="335" y="86.79999999999998" font-size="3.1">KM1–KM3 — ступени притока,</text>
<text x="335" y="91.39999999999998" font-size="3.1">KM4–KM6 — вытяжки: узкие реле 6,2 мм,</text>
<text x="335" y="95.99999999999997" font-size="3.1">CO, катушка 12 В DC; переключают отвод</text>
<text x="335" y="100.59999999999997" font-size="3.1">автотрансформатора на мотор, блокировка</text>
<text x="335" y="105.19999999999996" font-size="3.1">NC-контактами (docs/salda_in_unit.md).</text>
<text x="335" y="109.79999999999995" font-size="3.1">KM7 — заслонка. KL1–KL3 — контроль</text>
<text x="335" y="114.39999999999995" font-size="3.1">термостатов (катушка 230 В).</text>
<text x="335" y="118.99999999999994" font-size="3.1">F1 — предохранитель БП 12 В (0,5 А).</text>
<text x="335" y="123.59999999999994" font-size="3.1">XT 230 В — N и PE моторов, заслонки.</text>
<text x="335" y="128.19999999999993" font-size="3.1"></text>
<text x="335" y="132.79999999999993" font-size="3.1">SSR лежат на алюминиевой полосе:</text>
<text x="335" y="137.39999999999992" font-size="3.1">силовые клеммы вверх (к 230 В),</text>
<text x="335" y="141.99999999999991" font-size="3.1">клеммы управления вниз (к ключам).</text>
<text x="335" y="146.5999999999999" font-size="3.1"></text>
<text x="335" y="151.1999999999999" font-size="3.1">Белый кабель (заводской) освобождает</text>
<text x="335" y="155.7999999999999" font-size="3.1">место под плату — переложить к</text>
<text x="335" y="160.3999999999999" font-size="3.1">правому краю.</text>
<text x="335" y="164.9999999999999" font-size="3.1"></text>
<text x="335" y="169.59999999999988" font-size="3.1">Ввод, автотрансформатор, конденсаторы,</text>
<text x="335" y="174.19999999999987" font-size="3.1">жгут — на своих местах, как с завода.</text>
<text x="335" y="178.79999999999987" font-size="3.1"></text>
<text x="335" y="183.39999999999986" font-size="3.1">Сверить по месту: координаты заводских</text>
<text x="335" y="187.99999999999986" font-size="3.1">узлов сняты с фото (±10 мм).</text>
