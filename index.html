<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#eef1f5" />
    <title>Стенд персонажа</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <aside class="side">
      <details class="panel" id="pose-panel" open>
        <summary>Позы</summary>
        <div class="panel-body">
          <div class="pose-grid" id="pose-buttons"></div>

          <label class="toggle">
            <input type="checkbox" id="feet-on-floor" checked />
            <span>Стопы на полу <small>ноги подстраиваются сами</small></span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="symmetric" />
            <span>Симметрично <small>левое и правое вместе</small></span>
          </label>

          <button type="button" class="preset" data-action="shake">Встряхнуть</button>
        </div>
      </details>

      <details class="panel" id="emotion-panel" open>
        <summary>Эмоции</summary>
        <div class="panel-body">
          <div class="pose-grid" id="emotion-buttons"></div>
          <label class="toggle">
            <input type="checkbox" id="live-face" checked />
            <span>Живые глаза <small>моргает и водит взглядом</small></span>
          </label>
        </div>
      </details>

      <details class="panel" id="joint-panel" open>
        <summary>Суставы</summary>
        <div class="panel-body">
          <div class="chips" id="joint-groups" role="tablist" aria-label="Часть тела"></div>
          <div id="joint-sliders"></div>
        </div>
      </details>
    </aside>

    <nav class="views" aria-label="Ракурсы камеры">
      <button type="button" data-view="front" class="active">Анфас</button>
      <button type="button" data-view="threeQuarter">¾</button>
      <button type="button" data-view="profile">Профиль</button>
      <button type="button" data-view="threeQuarterBack">¾ сзади</button>
      <button type="button" data-view="back">Спина</button>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
